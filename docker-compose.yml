name: goals
services:
  mongo:
    image: mongo:7
    container_name: goals-mongo
    restart: unless-stopped
    volumes:
      - goals_mongo_data:/data/db

  backend:
    build:
      dockerfile: backend/Dockerfile
    container_name: goals-backend
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      # Bind to localhost only — public HTTPS is served by Caddy
      # (goals.63-181-3-204.sslip.io) which reverse-proxies to 127.0.0.1:2200.
      - "127.0.0.1:2200:2200"
    env_file:
      - backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: goals_db
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_service_account
    volumes:
      - ./backend/goals-firebase-service-account.json:/run/secrets/firebase_service_account:ro

volumes:
  goals_mongo_data:
