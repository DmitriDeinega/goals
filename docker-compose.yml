name: goals
services:
  postgres:
    image: postgres:16
    container_name: goals-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: goals
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goals}
      POSTGRES_DB: goals_db
    volumes:
      - goals_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goals -d goals_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      dockerfile: backend/Dockerfile
    container_name: goals-backend
    restart: unless-stopped
    depends_on:
      # The backend applies schema.sql on boot, so Postgres must be accepting
      # connections first — plain `depends_on` only waits for container start.
      postgres:
        condition: service_healthy
    ports:
      # Bind to localhost only — HTTPS is terminated by `tailscale serve` in
      # front of this (fermats-eco.tail164998.ts.net:2443) and reverse-proxied
      # to 127.0.0.1:2200. Never expose this port directly.
      - "127.0.0.1:2200:2200"
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://goals:${POSTGRES_PASSWORD:-goals}@postgres:5432/goals_db
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_service_account
    volumes:
      - ./backend/goals-firebase-service-account.json:/run/secrets/firebase_service_account:ro

volumes:
  goals_pg_data:
